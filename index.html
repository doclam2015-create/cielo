<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cielo</title>
<meta name="description" content="Clima y pronóstico personal: horas, 16 días, radar, calidad del aire, salud, sol y luna, sismos.">
<meta name="theme-color" content="#0b1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cielo">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js" defer></script>
<style>
:root{--acc:#ff7a1a;--txt:#fff;--dim:rgba(255,255,255,.68);--dim2:rgba(255,255,255,.45);--card:rgba(255,255,255,.12);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--r:22px;--g1:#1d4f8f;--g2:#5f9fd8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b1630;color:var(--txt);font:15px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#ffb27a}
#bg{position:fixed;inset:0;background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%);z-index:-2;transition:background 1.2s}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.18),transparent 60%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.app{max-width:1440px;margin:0 auto}
aside#side{display:none}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 10px;background:linear-gradient(180deg,rgba(8,14,30,.35),rgba(8,14,30,.08));backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.92)}
.ib.spin svg{animation:spin 1s linear infinite}
.place{flex:1;min-width:0;text-align:center}
.place b{display:flex;justify-content:center;align-items:center;gap:5px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden}
.place b span{overflow:hidden;text-overflow:ellipsis}
.place small{color:var(--dim);font-size:12px;display:block}
main{padding:4px 14px calc(100px + env(safe-area-inset-bottom))}
.view{display:none}
.view.on{display:block;animation:fade .35s ease}
.cards{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);min-width:0}
.card h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;color:#ffb27a;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;background:none;border:0;padding:0}
.hero{text-align:center;padding:14px 0 6px}
.hero .ic{display:flex;justify-content:center;margin-bottom:-6px}
.hero .tmp{font-size:104px;font-weight:200;line-height:1;letter-spacing:-5px;margin-left:18px}
.hero .cond{font-size:21px;font-weight:500;margin-top:2px}
.hero .rf{color:var(--dim);margin-top:4px}
.hero .hl{margin-top:4px;font-weight:500}
.sum{font-size:15px;line-height:1.45}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hs{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hin{position:relative}
.hcols{display:flex}
.hc{flex:none;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hc small{color:var(--dim);font-size:12px}
.hc em{font-style:normal;font-size:11px;color:#7cc4ff;min-height:14px}
.hc.now small{color:#fff;font-weight:700}
.hc.ss small{color:#ffcf5c}
svg text{font-family:inherit}
.drow{display:grid;grid-template-columns:62px 34px 46px minmax(0,1fr);align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.drow:first-of-type{border-top:0}
.drow b{display:block;font-weight:600}
.drow small{color:var(--dim);font-size:12px}
.pp{font-size:12px;color:#7cc4ff;text-align:left}
.bar{display:flex;align-items:center;gap:8px;font-weight:500}
.bar span{width:34px;text-align:right;flex:none}
.bar span.lo{color:var(--dim)}
.bar span.hi{text-align:left}
.bar i{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.25)}
.bar i b{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#5ac8fa,#ffd60a,#ff7a1a)}
.bar i u{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35);margin-left:-6px}
.dg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card2);border-radius:16px;padding:12px;min-height:96px;position:relative;overflow:hidden}
.tile .k{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .v{font-size:26px;font-weight:500;margin-top:4px}
.tile .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.meter{height:5px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,#30d158,#ffd60a,#ff9f0a,#ff453a,#bf5af2);position:relative}
.meter u{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);margin-left:-5px}
.mc{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:10px}
.mc i{flex:1;background:#5ac8fa;border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.mcl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);margin-top:8px;border-left:4px solid}
.alert b{display:block}
.alert:first-of-type{margin-top:0}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}
.act .e{font-size:24px;line-height:1.1}
.act .n{font-size:12px;margin-top:3px}
.act .l{font-size:12px;font-weight:600;margin-top:2px}
.act .sc{height:4px;border-radius:2px;background:rgba(0,0,0,.25);margin:6px 8px 0;overflow:hidden}
.act .sc b{display:block;height:100%}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:18px;padding:7px 13px;font-size:13.5px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button.on{background:var(--acc);border-color:var(--acc);font-weight:600}
.hrow{border-top:1px solid var(--line);padding:9px 0;cursor:pointer}
.hrow .hm{display:grid;grid-template-columns:50px 34px 50px minmax(0,1fr) auto;align-items:center;gap:8px}
.hrow .hd{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;font-size:12.5px;color:var(--dim);padding:8px 0 2px 92px}
.hrow .hd b{color:#fff;font-weight:500;display:block}
.hrow.open .hd{display:grid}
.dayh{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wh{font-size:11px;color:var(--dim);text-align:center;font-weight:600}
.cal .c{background:var(--card2);border-radius:12px;padding:5px 2px 6px;text-align:center;font-size:12px;min-height:76px;cursor:pointer}
.cal .c.past{opacity:.55}
.cal .c.today{outline:2px solid var(--acc)}
.cal .c .d{font-weight:700;font-size:12px}
.cal .c .t{font-size:11.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:600;color:var(--dim);font-size:11.5px}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
.mapwrap{position:relative;height:calc(100dvh - 196px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:360px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#111827}
.mapwrap iframe,#lmap{position:absolute;inset:0;width:100%;height:100%;border:0}
.rctl{position:absolute;left:10px;right:10px;bottom:10px;z-index:900;display:flex;gap:10px;align-items:center;background:rgba(12,18,30,.8);padding:8px 12px;border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rctl input{flex:1;accent-color:var(--acc)}
.rctl .ib{width:34px;height:34px}
.rctl .tl{font-size:12.5px;min-width:76px;text-align:right}
.leg{position:absolute;top:10px;left:10px;z-index:900;background:rgba(12,18,30,.75);border-radius:12px;padding:6px 10px;font-size:11px}
.leg i{display:block;width:120px;height:6px;border-radius:3px;margin:4px 0 2px;background:linear-gradient(90deg,#88ddee,#0099cc,#0077aa,#ffee00,#ffaa00,#ff4400,#c10000,#ff00ff)}
.leaflet-container{background:#0d1320;font:inherit}
.leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.45)!important;color:#ccc!important}
.leaflet-control-attribution a{color:#ddd!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1b2235;color:#fff}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .25s}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:calc(82dvh - env(safe-area-inset-top));overflow:auto;overscroll-behavior:contain;background:rgba(20,26,42,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:26px 26px 0 0;padding:8px 16px calc(26px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.3,1);border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:4px auto 10px}
.sheet .top{position:sticky;top:-8px;z-index:3;margin:-8px -16px 4px;padding:8px 16px 4px;background:rgba(20,26,42,.97);touch-action:none}
.sheet .x{position:absolute;right:12px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:600;display:grid;place-items:center;cursor:pointer}
.sheet h2{margin:0 0 4px;font-size:22px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--card2);border-radius:14px;padding:10px 12px}
.kv small{display:block;color:var(--dim);font-size:11.5px}
.kv b{font-weight:500;font-size:16px}
.locs .q{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:16px;outline:0}
.locs .q::placeholder{color:var(--dim2)}
.lr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--card2);border-radius:16px;padding:12px 14px;margin-top:8px}
.lr.on{background:rgba(255,122,26,.22);outline:1px solid rgba(255,122,26,.6)}
.lr .nm{flex:1;min-width:0}
.lr .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .nm small{color:var(--dim);font-size:12px}
.lr .tp{font-size:24px;font-weight:300}
.lr .x{border:0;background:rgba(255,69,58,.25);border-radius:50%;width:28px;height:28px;color:#ff8a80;flex:none}
.res .lr{background:rgba(255,255,255,.06)}
.btn{border:0;background:var(--acc);border-radius:14px;padding:11px 16px;font-weight:600}
.btn.g{background:var(--card2);border:1px solid var(--line);font-weight:500}
.ug{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.ug button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:7px 12px;font-size:13.5px}
.ug button.on{background:var(--acc);border-color:var(--acc)}
.pol{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.pol i{height:6px;border-radius:3px;background:rgba(0,0,0,.25);position:relative;overflow:hidden}
.pol i b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.ring{width:84px;height:84px;flex:none}
.qk{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.qk .m{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#111}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:rgba(20,26,42,.92);padding:9px 16px;border-radius:14px;font-size:13.5px;z-index:80;border:1px solid var(--line);animation:fade .25s;max-width:90vw;text-align:center}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translate(-50%,-160px);z-index:25;transition:transform .2s;background:rgba(20,26,42,.9);border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;border-radius:28px;background:rgba(16,20,32,.62);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--line);z-index:40;width:min(540px,calc(100% - 24px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
nav.tabs button{flex:1;border:0;background:none;color:var(--dim);font-size:10.5px;font-weight:500;padding:6px 0 4px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s,color .2s}
nav.tabs button.on{color:#fff;background:rgba(255,255,255,.14)}
nav.tabs button.on svg{color:var(--acc)}
.err{text-align:center;padding:60px 20px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.4s infinite}
.foot{font-size:12px;color:var(--dim2);text-align:center;padding:16px 0 4px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sk{to{background-position:-200% 0}}
@media (min-width:700px){
  .dg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .acts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sheet .pn{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(620px,92vw);border-radius:26px;animation:fade .25s;max-height:86dvh;border:1px solid var(--line)}
}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:340px minmax(0,1fr)}
  aside#side{display:block;position:sticky;top:0;height:100dvh;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 110px;border-right:1px solid var(--line);background:rgba(0,0,0,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  aside h1{font-size:28px;margin:4px 0 12px;font-weight:700;letter-spacing:-.5px}
  #btnLocs{visibility:hidden}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wide{grid-column:1/-1}
  main{padding:4px 22px calc(100px + env(safe-area-inset-bottom))}
  .hero .tmp{font-size:128px}
  nav.tabs{left:calc(50% + 170px)}
}
@media (min-width:1300px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.dg{grid-template-columns:repeat(4,minmax(0,1fr))}}
:root.hc{--card:rgba(8,12,22,.78);--card2:rgba(255,255,255,.14);--dim:rgba(255,255,255,.92);--dim2:rgba(255,255,255,.8);--line:rgba(255,255,255,.32)}
:root.big main,:root.big .sheet .pn,:root.big aside#side{zoom:1.15}
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(10,132,255,.45),rgba(90,200,250,.25));border:1px solid rgba(90,200,250,.6)}
.cmp td{vertical-align:middle}.cmp td small{display:block;color:var(--dim);font-size:11px}
.vk{padding:10px 0;border-top:1px solid var(--line)}.vk:first-of-type{border-top:0}
.tap{cursor:pointer;transition:transform .15s}.tap:active{transform:scale(.97)}
.tile.tap::after{content:"›";position:absolute;right:10px;top:8px;color:var(--dim2);font-size:18px}
.hc{cursor:pointer}.act{cursor:pointer}
.mtools{position:absolute;top:10px;right:10px;z-index:900;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mtools .grp{display:flex;background:rgba(12,18,30,.8);border-radius:12px;overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mtools button{border:0;background:none;color:#fff;font-size:12px;padding:7px 10px}
.mtools button.on{background:var(--acc);font-weight:600}
.mtools .ib{width:36px;height:36px;background:rgba(12,18,30,.8)}
.pop b{font-size:15px}.pop .t{font-size:30px;font-weight:300;line-height:1.1}.pop .btn{padding:7px 10px;font-size:13px;margin-top:8px;width:100%}
.leaflet-popup-content{margin:12px 14px;min-width:190px}
.ph{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ph:first-of-type{border-top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div class="ptr" id="ptr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>
<div class="app">
  <aside id="side"><h1>Cielo</h1><div class="locs" id="sideLocs"></div></aside>
  <div>
    <header class="top">
      <button class="ib" id="btnLocs" aria-label="Ubicaciones"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="place" id="place"><b><span>Cielo</span></b><small>Cargando…</small></div>
      <button class="ib" id="btnShare" aria-label="Compartir"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button class="ib" id="btnRef" aria-label="Actualizar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </header>
    <main>
      <section class="view on" id="v-hoy"><div class="cards"><div class="skel wide"></div><div class="skel"></div><div class="skel"></div></div></section>
      <section class="view" id="v-horas"></section>
      <section class="view" id="v-dias"></section>
      <section class="view" id="v-mapas">
        <div class="seg" id="mapseg"></div>
        <div class="mapwrap" id="mapbox"></div>
      </section>
      <section class="view" id="v-mas"></section>
    </main>
  </div>
</div>

<div class="sheet" id="sheet"><div class="bd"></div><div class="pn"><div class="top"><div class="grab"></div><button class="x" aria-label="Cerrar">✕</button></div><div id="sheetIn"></div></div></div>
<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const S=Object.assign({u:{t:'C',w:'kmh',p:'mm'},fx:true,big:false,hc:false,locs:[],sel:'gps',gps:null},LS.get('cielo',{}));
const save=()=>LS.set('cielo',{u:S.u,fx:S.fx,big:S.big,hc:S.hc,locs:S.locs,sel:S.sel,gps:S.gps});
const prefs=()=>{document.documentElement.classList.toggle('big',S.big);document.documentElement.classList.toggle('hc',S.hc)};prefs();
const EMB=/[?&]app=reglaar/.test(location.search);
const DEF={name:'Santiago',admin:'Región Metropolitana',country:'Chile',lat:-33.4489,lon:-70.6693};
const DAY=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],DAYL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let D=null, TAB='hoy', X={};
const VER='2026.10.03-7';
async function getJ(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function js(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function css(href){return new Promise(ok=>{const l=document.createElement('link');l.rel='stylesheet';l.href=href;l.onload=ok;l.onerror=ok;document.head.appendChild(l)})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const nf=(n,d=0)=>n==null||isNaN(n)?'–':n.toLocaleString('es-CL',{maximumFractionDigits:d,minimumFractionDigits:d});
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const avg=a=>{const b=a.filter(x=>x!=null);return b.length?sum(b)/b.length:null};
const clamp=(x,a=0,b=10)=>Math.max(a,Math.min(b,x));

/* ============ unidades ============ */
const tC=c=>c==null?null:(S.u.t==='F'?c*9/5+32:c);
const T=c=>c==null?'–':Math.round(tC(c))+'°';
const WU={kmh:['km/h',1],ms:['m/s',1/3.6],mph:['mph',1/1.609],kn:['nudos',1/1.852]};
const Wn=k=>k==null?'–':Math.round(k*WU[S.u.w][1]);
const W=k=>Wn(k)+' '+WU[S.u.w][0];
const P=mm=>mm==null?'–':S.u.p==='in'?(mm/25.4).toFixed(2)+' in':nf(mm,mm<10?1:0)+' mm';
const dir=d=>d==null?'':['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'][Math.round(d/22.5)%16];

/* ============ tiempo local de la ubicación ============ */
const off=()=>D.f.utc_offset_seconds;
const nowLoc=()=>new Date(Date.now()+off()*1000).toISOString().slice(0,16);
const hIdx=()=>{const i=D.f.hourly.time.indexOf(nowLoc().slice(0,13)+':00');return i<0?0:i};
const dIdx=()=>{const i=D.f.daily.time.indexOf(nowLoc().slice(0,10));return i<0?0:i};
const hm=s=>s?s.slice(11,16):'–';
const wd=(s,l)=>(l?DAYL:DAY)[new Date(s.slice(0,10)+'T12:00Z').getUTCDay()];
const dm=s=>+s.slice(8,10)+' '+MES[+s.slice(5,7)-1];
const fT=dt=>dt&&!isNaN(dt)?new Date(dt.getTime()+off()*1000).toISOString().slice(11,16):'–';
const mins=s=>+s.slice(11,13)*60+ +s.slice(14,16);
const dur=sec=>{const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h+' h '+String(m).padStart(2,'0')+' min'};

/* ============ condiciones e íconos ============ */
const WMO={0:['Despejado','clear'],1:['Mayormente despejado','mostly'],2:['Parcialmente nublado','partly'],3:['Nublado','cloudy'],45:['Niebla','fog'],48:['Niebla con escarcha','fog'],51:['Llovizna débil','drizzle'],53:['Llovizna','drizzle'],55:['Llovizna intensa','drizzle'],56:['Llovizna helada','sleet'],57:['Llovizna helada intensa','sleet'],61:['Lluvia débil','rain'],63:['Lluvia','rain'],65:['Lluvia intensa','rain'],66:['Lluvia helada','sleet'],67:['Lluvia helada intensa','sleet'],71:['Nevada débil','snow'],73:['Nevada','snow'],75:['Nevada intensa','snow'],77:['Granos de nieve','snow'],80:['Chubascos débiles','showers'],81:['Chubascos','showers'],82:['Chubascos violentos','showers'],85:['Chubascos de nieve','snow'],86:['Chubascos de nieve intensos','snow'],95:['Tormenta eléctrica','storm'],96:['Tormenta con granizo','storm'],99:['Tormenta con granizo fuerte','storm']};
const wx=c=>WMO[c]||['—','cloudy'];
const CLOUD='M20 50h26a10 10 0 0 0 1.5-19.9A13 13 0 0 0 22.4 27 11.5 11.5 0 0 0 20 50z';
function sunG(){let r='';for(let a=0;a<360;a+=45){const t=a*Math.PI/180;r+=`<line x1="${(32+17*Math.cos(t)).toFixed(1)}" y1="${(32+17*Math.sin(t)).toFixed(1)}" x2="${(32+23*Math.cos(t)).toFixed(1)}" y2="${(32+23*Math.sin(t)).toFixed(1)}"/>`}return `<circle cx="32" cy="32" r="11.5" fill="#FFC93C"/><g stroke="#FFC93C" stroke-width="3.4" stroke-linecap="round">${r}</g>`}
const MOONP='<path d="M40 12a20 20 0 1 0 13 33A16 16 0 0 1 40 12z" fill="#ECEAFF"/>';
const cl=(f='#F4F7FB',t='')=>`<path d="${CLOUD}" fill="${f}" ${t?`transform="${t}"`:''}/>`;
function ico(code,day=1,s=40){const k=wx(code)[1];let g='';const up='translate(0,-6)';
  const drops=(n,col='#5AC8FA',len=7)=>{let r=`<g stroke="${col}" stroke-width="3" stroke-linecap="round">`;for(let i=0;i<n;i++){const x=22+i*(22/(n-1||1));r+=`<line x1="${x}" y1="51" x2="${x-3}" y2="${51+len}"/>`}return r+'</g>'};
  const flakes=n=>{let r='<g fill="#fff">';for(let i=0;i<n;i++){const x=22+i*(22/(n-1));r+=`<circle cx="${x}" cy="${i%2?58:53}" r="2.6"/>`}return r+'</g>'};
  const sm=day?`<g transform="translate(-6,-9) scale(.78)">${sunG()}</g>`:`<g transform="translate(-4,-8) scale(.8)">${MOONP}</g>`;
  switch(k){
    case 'clear':g=day?sunG():MOONP;break;
    case 'mostly':g=(day?sunG():MOONP).replace(/^/,'')+`<g transform="translate(14,14) scale(.62)">${cl()}</g>`;break;
    case 'partly':g=sm+cl();break;
    case 'cloudy':g=cl('#AEB8C6','translate(-6,-8) scale(.85)')+cl('#E6EBF2');break;
    case 'fog':g=cl('#C9D1DC',up)+'<g stroke="#C9D1DC" stroke-width="3" stroke-linecap="round"><line x1="14" y1="52" x2="50" y2="52"/><line x1="20" y1="59" x2="44" y2="59"/></g>';break;
    case 'drizzle':g=cl('#DDE3EA',up)+drops(3,'#7CC4FF',4);break;
    case 'rain':g=cl('#C5CED9',up)+drops(4);break;
    case 'showers':g=(day?`<g transform="translate(-6,-12) scale(.7)">${sunG()}</g>`:`<g transform="translate(-4,-12) scale(.72)">${MOONP}</g>`)+cl('#D3DAE3',up)+drops(3);break;
    case 'sleet':g=cl('#C5CED9',up)+drops(2)+'<g fill="#fff"><circle cx="33" cy="56" r="2.6"/></g>';break;
    case 'snow':g=cl('#DDE3EA',up)+flakes(4);break;
    case 'storm':g=cl('#8E99A8',up)+'<path d="M35 46l-8 11h6l-4 9 11-13h-6l4-7z" fill="#FFD60A"/>'+drops(2,'#5AC8FA',5);break;
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">${g}</svg>`}
const DROP='<svg width="9" height="11" viewBox="0 0 10 12" style="vertical-align:-1px;margin-right:2px"><path d="M5 0C3 3.5 0 6 0 8.3A5 5 0 0 0 10 8.3C10 6 7 3.5 5 0z" fill="#7cc4ff"/></svg>';

/* ============ fondo animado ============ */
const BG={clear:[['#1f6fc4','#69b3ee'],['#070f26','#1b2a57']],mostly:[['#2a6eb5','#7fb0de'],['#0b1430','#25345e']],partly:[['#38689c','#8aaed0'],['#101a33','#2c3a5c']],cloudy:[['#4d5d70','#8d9aaa'],['#161c26','#353e4c']],fog:[['#66717d','#a3acb6'],['#1b2027','#3d454f']],drizzle:[['#3e5268','#71869c'],['#111823','#2a3546']],rain:[['#34465b','#617890'],['#0e141f','#25303f']],showers:[['#3b5370','#7690ab'],['#0f1624','#283447']],sleet:[['#4d5e72','#8a9bb0'],['#151c27','#323d4e']],snow:[['#7d93ab','#c6d3e0'],['#202a3a','#4a586d']],storm:[['#262436','#4c4862'],['#121019','#2c2938']]};
const fx={c:$('#fx'),x:null,p:[],mode:'',raf:0,flash:0};
function setScene(code,day){const k=wx(code)[1],g=(BG[k]||BG.cloudy)[day?0:1];document.documentElement.style.setProperty('--g1',g[0]);document.documentElement.style.setProperty('--g2',g[1]);document.querySelector('meta[name=theme-color]').content=g[0];
  let m='';if(['rain','showers','drizzle','storm','sleet'].includes(k))m='rain';else if(k==='snow')m='snow';else if(!day&&['clear','mostly','partly'].includes(k))m='stars';
  if(!S.fx||matchMedia('(prefers-reduced-motion: reduce)').matches)m='';
  fxStart(m,k)}
function fxStart(m,k){cancelAnimationFrame(fx.raf);const c=fx.c,dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;fx.x=c.getContext('2d');fx.x.setTransform(dpr,0,0,dpr,0,0);fx.mode=m;fx.storm=k==='storm';fx.heavy=k==='rain'||k==='storm'?1:k==='drizzle'?.35:.6;
  const n=m==='rain'?Math.round(140*fx.heavy):m==='snow'?90:m==='stars'?(k==='clear'?130:60):0;fx.p=[...Array(n)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:Math.random(),z:Math.random()}));
  fx.x.clearRect(0,0,innerWidth,innerHeight);if(m)loop()}
function loop(){const x=fx.x,w=innerWidth,h=innerHeight;x.clearRect(0,0,w,h);
  if(fx.mode==='rain'){x.strokeStyle='rgba(200,225,255,.38)';x.lineWidth=1.1;x.beginPath();for(const p of fx.p){const sp=9+p.z*10;x.moveTo(p.x,p.y);x.lineTo(p.x-1.5,p.y+8+p.z*8);p.y+=sp;p.x-=1.2;if(p.y>h){p.y=-20;p.x=Math.random()*w}}x.stroke();
    if(fx.storm){if(fx.flash>0){x.fillStyle=`rgba(255,255,255,${fx.flash*.35})`;x.fillRect(0,0,w,h);fx.flash-=.06}else if(Math.random()<.004)fx.flash=1}}
  else if(fx.mode==='snow'){x.fillStyle='rgba(255,255,255,.85)';for(const p of fx.p){x.beginPath();x.arc(p.x,p.y,1+p.z*2.4,0,7);x.fill();p.y+=.6+p.z*1.4;p.x+=Math.sin((p.y+p.v*100)/40)*.6;if(p.y>h){p.y=-5;p.x=Math.random()*w}}}
  else if(fx.mode==='stars'){const t=performance.now()/1000;for(const p of fx.p){if(p.y>h*.7)continue;const a=.25+.6*Math.abs(Math.sin(t*.8+p.v*20))*p.z;x.fillStyle=`rgba(255,255,255,${a})`;x.fillRect(p.x,p.y,p.z>.85?2:1.2,p.z>.85?2:1.2)}}
  fx.raf=requestAnimationFrame(loop)}
addEventListener('resize',()=>{if(D){const c=D.f.current;setScene(c.weather_code,c.is_day)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(fx.raf);else{if(fx.mode)loop();if(D&&Date.now()-D.ts>15*60e3)load(true)}});

/* ============ ubicaciones ============ */
function curLoc(){if(S.sel==='gps')return S.gps||S.locs[0]||DEF;return S.locs[S.sel]||S.gps||DEF}
function locate(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(async p=>{const lat=+p.coords.latitude.toFixed(4),lon=+p.coords.longitude.toFixed(4);let name='Mi ubicación',admin='',country='';try{const r=await getJ(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`);name=r.city||r.locality||name;admin=r.principalSubdivision||'';country=r.countryName||''}catch(e){}S.gps={name,admin,country,lat,lon,gps:1};save();res(S.gps)},()=>res(null),{enableHighAccuracy:false,timeout:12000,maximumAge:600000})})}
async function locTemps(){const all=[S.gps,...S.locs].filter(Boolean);if(!all.length)return{};const k=all.map(l=>l.lat+','+l.lon).join('|');if(X.lt&&X.lt.k===k&&Date.now()-X.lt.ts<10*60e3)return X.lt.m;
  try{const r=await getJ(`https://api.open-meteo.com/v1/forecast?latitude=${all.map(l=>l.lat).join(',')}&longitude=${all.map(l=>l.lon).join(',')}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`);const arr=Array.isArray(r)?r:[r];const m={};all.forEach((l,i)=>m[l.lat+','+l.lon]=arr[i]);X.lt={k,ts:Date.now(),m};return m}catch(e){return{}}}
function locsHTML(m={}){const row=(l,sel,idx)=>{const d=m[l.lat+','+l.lon];return `<div class="lr ${sel?'on':''}" data-sel="${idx}" role="button"><div class="nm"><b>${l.gps?'📍 ':''}${esc(l.name)}</b><small>${esc([l.admin,l.country].filter(Boolean).join(', '))}${d?` · ${wx(d.current.weather_code)[0]} · ${T(d.daily.temperature_2m_max[0])} / ${T(d.daily.temperature_2m_min[0])}`:''}</small></div>${d?`${ico(d.current.weather_code,d.current.is_day,34)}<span class="tp">${T(d.current.temperature_2m)}</span>`:''}${idx!=='gps'?`<button class="x" data-del="${idx}" aria-label="Quitar">✕</button>`:''}</div>`};
  return `<input class="q" type="search" placeholder="Buscar ciudad o lugar…" autocomplete="off" enterkeyhint="search"><div class="res"></div>
  ${S.gps?row(S.gps,S.sel==='gps','gps'):`<button class="lr" data-gps="1"><div class="nm"><b>📍 Usar mi ubicación</b><small>Permite el acceso a la ubicación</small></div></button>`}
  ${S.locs.map((l,i)=>row(l,S.sel===i,i)).join('')}
  ${S.gps?'<button class="btn g" data-gps="1" style="width:100%;margin-top:10px">Actualizar mi ubicación</button>':''}`}
async function renderLocs(){const m0=X.lt?X.lt.m:{};$('#sideLocs').innerHTML=locsHTML(m0);if($('#sheet.on .locs'))$('#sheet .locs').innerHTML=locsHTML(m0);const m=await locTemps();if(!document.activeElement||!document.activeElement.matches('.q')){$('#sideLocs').innerHTML=locsHTML(m);if($('#sheet.on .locs'))$('#sheet .locs').innerHTML=locsHTML(m)}}
let qT;document.addEventListener('input',e=>{if(!e.target.matches('.q'))return;clearTimeout(qT);const v=e.target.value.trim(),box=e.target.parentNode.querySelector('.res');qT=setTimeout(async()=>{if(v.length<2){box.innerHTML='';return}
  const r=await getJ(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=8&language=es`).catch(()=>({}));
  box.innerHTML=(r.results||[]).map(x=>`<button class="lr" data-add="${esc(JSON.stringify({name:x.name,admin:x.admin1||'',country:x.country||'',lat:+x.latitude.toFixed(4),lon:+x.longitude.toFixed(4)}))}"><div class="nm"><b>${esc(x.name)}</b><small>${esc([x.admin1,x.country].filter(Boolean).join(', '))}</small></div><span class="dim">＋</span></button>`).join('')||'<p class="dim sm">Sin resultados</p>'},300)});

/* ============ datos ============ */
const CV='temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,dew_point_2m,uv_index';
const HV='temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,relative_humidity_2m,uv_index,is_day,cloud_cover,visibility,pressure_msl,dew_point_2m,snowfall,freezing_level_height';
const DV='weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,daylight_duration,sunshine_duration,uv_index_max,precipitation_sum,precipitation_probability_max,precipitation_hours,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,snowfall_sum';
const POL='alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen';
const AV='us_aqi,european_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,uv_index,'+POL;
async function fetchAll(l){const q=`latitude=${l.lat}&longitude=${l.lon}&timezone=auto`;
  const [f,a,m]=await Promise.all([
    getJ(`https://api.open-meteo.com/v1/forecast?${q}&current=${CV}&hourly=${HV}&daily=${DV}&minutely_15=precipitation&forecast_days=16&past_days=1`),
    getJ(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=${AV}&hourly=us_aqi,pm2_5,pm10,${POL}&forecast_days=5&past_days=1`).catch(()=>null),
    getJ(`https://marine-api.open-meteo.com/v1/marine?${q}&current=wave_height,wave_direction,wave_period,swell_wave_height,sea_surface_temperature&daily=wave_height_max,wave_period_max,wave_direction_dominant&forecast_days=7`).catch(()=>null)]);
  return {loc:l,f,a,m:m&&m.current&&m.current.wave_height!=null?m:null,ts:Date.now()}}
const keyOf=l=>l.lat.toFixed(2)+','+l.lon.toFixed(2);
function store(k,d){if(LS.set('wx:'+k,d))return;Object.keys(localStorage).filter(x=>x.startsWith('wx:')||x.startsWith('hist:')).forEach(x=>localStorage.removeItem(x));LS.set('wx:'+k,d)}
let busy=0;
async function load(force){const l=curLoc(),k=keyOf(l),c=LS.get('wx:'+k,null);
  if(c&&(!D||keyOf(D.loc)!==k)){D=c;D.loc=l;render()}
  if(!force&&c&&Date.now()-c.ts<10*60e3){if(!D)D=c;return}
  busy++;$('#btnRef').classList.add('spin');
  try{const d=await fetchAll(l);if(keyOf(curLoc())===k){D=d;store(k,d);X.hist=X.models=X.month=null;render()}}
  catch(e){if(!D||keyOf(D.loc)!==k)$('#v-hoy').innerHTML=`<div class="err"><div style="font-size:44px">📡</div><h3>Sin conexión</h3><p class="dim">No se pudo cargar el pronóstico. Revisa tu conexión e intenta de nuevo.</p><button class="btn" onclick="load(true)">Reintentar</button></div>`;else toast('Sin conexión · mostrando datos guardados')}
  busy--;if(!busy)$('#btnRef').classList.remove('spin')}

const GIBS='https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/';
// Horas disponibles de una capa de NASA GIBS (DescribeDomains), dentro de las últimas `back` horas
async function gibsTimes(layer,tms,back){const iso=x=>new Date(x).toISOString().slice(0,19)+'Z',a=Date.now()-back*36e5;
  const t=await fetch(`${GIBS}wmts.cgi?SERVICE=WMTS&REQUEST=DescribeDomains&VERSION=1.0.0&LAYER=${layer}&TILEMATRIXSET=${tms}&TIME=${iso(a)}/${iso(Date.now())}`).then(r=>r.text());
  const m=t.match(/<Domain>([^<]*)<\/Domain>/),out=[];if(!m)return out;
  m[1].split(',').forEach(iv=>{const [s0,e,p]=iv.split('/');if(!e){out.push(iso(Date.parse(s0)));return}const st=+((p||'').match(/PT(\d+)M/)||[0,30])[1]*6e4;for(let x=Date.parse(e);x>=Date.parse(s0)&&x>=a;x-=st)out.push(iso(x))});
  return [...new Set(out)].sort()}
const tLoc=ms=>{const x=new Date(ms+off()*1000).toISOString(),d=x.slice(0,10)===nowLoc().slice(0,10)?'':+x.slice(8,10)+' '+MES[+x.slice(5,7)-1]+' ';return d+x.slice(11,16)};

function animate(mode,layers,labels,k,fut=()=>false,op=.82){const box=$('#mapbox');if(!MAP||MAPMODE!==mode)return;
  box.insertAdjacentHTML('beforeend',`<div class="rctl"><button class="ib" id="rplay" aria-label="Reproducir"></button><input type="range" id="rr" min="0" max="${layers.length-1}" value="${k}"><span class="tl" id="rtl"></span></div>`);
  const icoP=on=>on?'<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg>';
  const show=n=>{layers[k].setOpacity(0);k=n;layers[k].setOpacity(op);$('#rtl').innerHTML=(fut(k)?'<b style="color:#ffb27a">Pronóstico</b> ':'')+labels[k];$('#rr').value=k};
  const play=on=>{stopRadar();$('#rplay').innerHTML=icoP(on);if(on)RT=setInterval(()=>show((k+1)%layers.length),700)};
  show(k);$('#rr').oninput=e=>{play(false);show(+e.target.value)};$('#rplay').onclick=()=>play(!RT);play(true)}
async function radar(){let r;try{r=await getJ('https://api.rainviewer.com/public/weather-maps.json')}catch(e){toast('Radar no disponible');return}if(!MAP||MAPMODE!=='radar')return;

// Fases de la Luna con el método de Meeus (Astronomical Algorithms, cap. 49): error de 1–2 minutos.
function meeusFase(k){const q=Math.round((k%1+1)%1*4)%4,T=k/1236.85,r=Math.PI/180,E=1-.002516*T-.0000074*T*T;
  let J=2451550.09766+29.530588861*k+.00015437*T*T-.00000015*T**3+.00000000073*T**4;

function setTab(t){TAB=t;$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));$$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));scrollTo({top:0});if(t!=='mapas'){stopRadar()}if(!D)return;if(t==='mapas')showMap(MAPMODE);if(t==='mas')renderMas();if(t==='dias'&&DV_!=='lista')renderDias()}
function render(){if(!D)return;const c=D.f.current,l=D.loc;setScene(c.weather_code,c.is_day);
  $('#place').innerHTML=`<b>${l.gps?'<svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M21 3 3 10.5l7.5 2.5L13 21z"/></svg>':''}<span>${esc(l.name)}</span></b><small>${esc([l.admin,l.country].filter(Boolean).join(', '))}</small>`;
  document.title=`${T(c.temperature_2m)} ${l.name} · Cielo`;
  try{renderHoy();renderHoras();if(DV_==='lista')renderDias();if(TAB==='mas')renderMas();if(TAB==='mapas')showMap(MAPMODE);if(TAB==='dias'&&DV_!=='lista')renderDias()}catch(e){console.error(e)}renderLocs()}
function openSheet(h){$('#sheetIn').innerHTML=h;$('#sheet').classList.add('on');$('#sheet .pn').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheet .pn').style.transform=''}
$('#sheet .bd').onclick=closeSheet;$('#sheet .x').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
(()=>{const pn=$('#sheet .pn');let y0=null,dy=0;pn.addEventListener('touchstart',e=>{y0=(pn.scrollTop<=0||e.target.closest('.top'))&&innerWidth<700?e.touches[0].clientY:null;dy=0;pn.style.transition='none'},{passive:true});pn.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){pn.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});pn.addEventListener('touchend',()=>{if(y0==null)return;pn.style.transition='transform .2s';if(dy>110){pn.style.transform='translateY(100%)';setTimeout(closeSheet,180)}else pn.style.transform='';y0=null})})();
$('#btnLocs').onclick=()=>{openSheet(`<h2>Ubicaciones</h2><div class="locs">${locsHTML(X.lt?X.lt.m:{})}</div>`);renderLocs()};
$('#btnRef').onclick=()=>{load(true);X.lt=null;if(SWR)SWR.update().catch(()=>{})};
$('#btnShare').onclick=async()=>{if(!D)return;const c=D.f.current,d=D.f.daily,i0=dIdx(),t=`${D.loc.name}: ${T(c.temperature_2m)}, ${wx(c.weather_code)[0].toLowerCase()} (sensación ${T(c.apparent_temperature)}). Hoy máx. ${T(d.temperature_2m_max[i0])}, mín. ${T(d.temperature_2m_min[i0])}, lluvia ${d.precipitation_probability_max[i0]??0}%. ${resumen()}`;
  try{if(navigator.share)await navigator.share({title:'Cielo · '+D.loc.name,text:t});else{await navigator.clipboard.writeText(t);toast('Copiado al portapapeles')}}catch(e){}};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-day],[data-more],[data-sel],[data-del],[data-add],[data-gps],[data-hm],[data-dv],[data-u],[data-fx],[data-map],[data-sald],[data-pref],[data-sh],[data-hr],[data-act],[data-qk],[data-base],[data-mloc],[data-mz],.hrow,#clr');if(!t)return;
  if(t.dataset.sh){SHEETS[t.dataset.sh]&&SHEETS[t.dataset.sh]();return}
  if(t.dataset.hr){sheetHour(+t.dataset.hr);return}
  if(t.dataset.act){sheetAct(t.dataset.act);return}
  if(t.dataset.qk){e.preventDefault();const [la,lo]=t.dataset.qk.split(',').map(Number),q=(X.q&&X.q.d||[]).find(z=>z.geometry.coordinates[1]===la&&z.geometry.coordinates[0]===lo);FOCUS=[la,lo,'Sismo M'+(q?nf(q.properties.mag,1):''),q?qInfo(q):''];MAPMODE='sismos';setTab('mapas');return}
  if(t.dataset.base){if(MAP)baseLayer(t.dataset.base);return}
  if(t.dataset.mz){if(MAP)MAP.setZoom(MAP.getZoom()+ +t.dataset.mz);return}
  if(t.dataset.mloc){if(MAP){const l=D.loc;focusPoint(L.latLng(l.lat,l.lon),l.name)}return}
  if(t.dataset.del!==undefined){e.stopPropagation();const i=+t.dataset.del;S.locs.splice(i,1);if(S.sel===i)S.sel=S.gps?'gps':0;else if(typeof S.sel==='number'&&S.sel>i)S.sel--;if(!S.gps&&!S.locs.length)S.locs.push(DEF);save();X.lt=null;renderLocs();load();return}
  if(t.dataset.map&&t.dataset.tab){MAPMODE=t.dataset.map;setTab('mapas');return}
  if(t.dataset.tab){closeSheet();setTab(t.dataset.tab);return}
  if(t.dataset.day!==undefined){openDay(+t.dataset.day);return}
  if(t.dataset.more){setTab('mas');setTimeout(()=>{const el=document.getElementById(t.dataset.more);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:'smooth'})},60);return}
  if(t.dataset.sel!==undefined){selectLoc(t.dataset.sel==='gps'?'gps':+t.dataset.sel);return}
  if(t.dataset.add){const l=JSON.parse(t.dataset.add);if(t.closest('.leaflet-popup'))setTab('hoy');let i=S.locs.findIndex(x=>keyOf(x)===keyOf(l));if(i<0){S.locs.push(l);i=S.locs.length-1}X.lt=null;$$('.q').forEach(q=>{q.value='';q.parentNode.querySelector('.res').innerHTML=''});selectLoc(i);return}
  if(t.dataset.gps){t.disabled=true;const g=await locate();if(g){X.lt=null;selectLoc('gps')}else{toast('Ubicación no disponible. Revisa los permisos de Safari en Ajustes → Privacidad → Localización.');t.disabled=false}return}
  if(t.dataset.hm){HMET=t.dataset.hm;renderHoras();return}
  if(t.dataset.dv){DV_=t.dataset.dv;renderDias();return}
  if(t.dataset.sald){SALD=+t.dataset.sald;const y=scrollY;renderMas();scrollTo({top:y});return}
  if(t.dataset.u){const [k,v]=t.dataset.u.split(':');S.u[k]=v;save();const y=scrollY;render();scrollTo({top:y});return}
  if(t.dataset.fx){S.fx=t.dataset.fx==='1';save();const y=scrollY;render();scrollTo({top:y});return}
  if(t.dataset.pref){const [k,v]=t.dataset.pref.split(':');S[k]=v==='1';save();prefs();const y=scrollY;renderMas();scrollTo({top:y});return}
  if(t.dataset.map){showMap(t.dataset.map);return}
  if(t.id==='clr'){Object.keys(localStorage).filter(x=>x.startsWith('wx:')||x.startsWith('hist:')).forEach(x=>localStorage.removeItem(x));toast('Datos guardados borrados');load(true);return}
  if(t.classList.contains('hrow'))t.classList.toggle('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
/* tirar para actualizar */
(()=>{let y0=null,dy=0;const p=$('#ptr');addEventListener('touchstart',e=>{y0=scrollY<=0&&!$('#sheet.on')&&TAB!=='mapas'?e.touches[0].clientY:null;dy=0},{passive:true});addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0)p.style.transform=`translate(-50%,${Math.min(dy,150)-150}px) rotate(${dy*3}deg)`},{passive:true});addEventListener('touchend',()=>{if(y0!=null&&dy>90){load(true);X.lt=null}p.style.transform='';y0=null})})();

/* ============ inicio ============ */
if(EMB){const b=document.createElement('button');b.className='ib';b.setAttribute('aria-label','Menú de Horizonte');b.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>';b.onclick=()=>location.href='reglaar://cerrar';$('header.top').prepend(b)}
setTab('hoy');
(async()=>{load();if(S.sel==='gps'){const g=await locate();if(g){load();renderLocs()}else if(!S.gps){if(!S.locs.length)S.locs.push(DEF);S.sel=0;save();renderLocs()}}})();
// Actualización automática: busca versión nueva al abrir, al volver a la app y al tocar actualizar; si hay, recarga sola.
let SWR=null;
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{SWR=r;r.update()}).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SWR)SWR.update().catch(()=>{})})}
</script>
