name: Actividad volcánica
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL -A "Mozilla/5.0 (Macintosh) AppleWebKit/605.1.15 Safari/605.1.15" https://volcano.si.edu/news/WeeklyVolcanoRSS.xml -o rss.xml && python3 tools/volcanes.py rss.xml
      - run: |
          git config user.name "cielo-bot"
          git config user.email "cielo-bot@users.noreply.github.com"
          git add volcanes.json
          git diff --cached --quiet || (git commit -m "Actividad volcánica $(date +%F)" && git push)
